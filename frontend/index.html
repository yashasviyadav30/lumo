    <title>Thrywe: learn anything from YouTube, without the noise</title>
    <!-- The preview when the link is shared (WhatsApp, Telegram, Instagram, X, LinkedIn): the banner, name and line. -->

    <meta property="og:title" content="Thrywe: learn anything from YouTube, without the noise" />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- The installed app opens on its logo (like other apps): violet, the letters land, then the app fades in.
         Only in the installed app (display-mode: standalone); it hides itself after 2.6 s even if scripts fail. -->
    <style>
      #splash { display: none; }
      @media (display-mode: standalone) {
        #splash {
          display: flex; position: fixed; inset: 0; z-index: 9999; flex-direction: column; align-items: center;
          justify-content: center; gap: 26px;
          background: radial-gradient(120% 90% at 50% 40%, #5a4ed1 0%, #4b3fbf 55%, #3d32a8 100%);
          animation: splash-out 0.45s ease 2.6s forwards;
        }
      }
      #splash svg { width: min(68vw, 400px); height: auto; overflow: visible; }
      #splash .g { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: splash-drop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
      #splash .g:nth-child(1) { animation-delay: 0.1s; }
      #splash .g:nth-child(2) { animation-delay: 0.18s; }
      #splash .g:nth-child(3) { animation-delay: 0.26s; }
      #splash .g:nth-child(4) { animation-delay: 0.34s; }
      #splash .g:nth-child(5) { animation-delay: 0.42s; }
      #splash .g:nth-child(6) { animation-delay: 0.5s; }
      #splash p { margin: 0; color: #fbf7ef; opacity: 0; font: 600 15px/1.4 system-ui, sans-serif; letter-spacing: 0.02em; animation: splash-fade 0.5s ease 0.8s forwards; }
      #splash p b { color: #fbe38e; font-weight: 600; }
      #splash.done { opacity: 0; transition: opacity 0.35s ease; pointer-events: none; }
      @keyframes splash-drop { from { opacity: 0; transform: translateY(-45%) scale(1.2); } to { opacity: 1; transform: none; } }
      @keyframes splash-fade { to { opacity: 0.92; } }
      @keyframes splash-out { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #splash .g, #splash p { animation: none; opacity: 1; } }
    </style>
  </head>
